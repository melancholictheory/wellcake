## valkey-cluster Helm values
##
## Requires valkey-operator (CRD cache.wellcake.io/v1alpha1) installed in the cluster.

nameOverride: ""
fullnameOverride: ""

# Annotations on the ValkeyCluster resource (not on its pods), for the
# operator's opt-in and request annotations. A request annotation (restart,
# rotate-password, failover, reshard) acts once per new value, so set a new
# value to run it again. Quote the values: Helm reads an unquoted number as a
# float. Example:
# annotations:
#   valkey.wellcake.io/proactive-rollout: "true"
#   valkey.wellcake.io/restart: "2026-10-28"
annotations: {}

# Optionally have this chart create the release Namespace and label it with the
# Pod Security Standards, so the restricted-PSA-compatible Valkey pods are
# actually enforced. When create=true the chart OWNS the namespace — install
# WITHOUT `helm --create-namespace`, into a namespace that does not yet exist,
# otherwise Helm refuses to adopt a namespace it does not manage.
namespace:
  create: false
  # enforce/warn/audit level: restricted | baseline | privileged.
  # Empty string → create the namespace without Pod Security labels.
  podSecurityStandard: restricted
  # Extra labels to merge onto the namespace.
  labels: {}

# Topology: Standalone | Replication | Sentinel | Cluster
topology: Replication

# Profile: Cache | Durable.
#  Cache    — allkeys-lru, persistence off, small PVC (1Gi default)
#  Durable  — noeviction, RDB+AOF, larger PVC (10Gi default)
profile: Cache

# Valkey image and pull policy.
image: valkey/valkey:8.0
imagePullPolicy: IfNotPresent
# Secrets (same namespace) used to pull every image of the cluster's pods
# (Valkey, Sentinel, exporter, backup/restore and cluster-operation Jobs).
# Example:
# imagePullSecrets:
#   - name: regcred
imagePullSecrets: []

# Number of pods (interpretation depends on topology).
replicas: 3

# Cluster-mode only.
shards: 3
replicasPerShard: 1
# Auto-rebalance slots on scale-up/scale-down so changing `shards` converges
# without a manual reshard. Set false to keep reshard a deliberate step.
autoReshard: true

# Resources for the Valkey container.
# maxmemory is auto-set by the operator at 60% of limits.memory.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Persistence. Cache profile defaults to a tiny PVC and no on-disk writes.
storage:
  # Leave empty to use profile defaults (Cache=1Gi, Durable=10Gi).
  size: ""
  storageClassName: ""
  # Mode: rdb | aof | both | none. Empty → profile default.
  mode: ""

auth:
  enabled: true
  existingSecret: ""

tls:
  enabled: false
  existingSecret: ""
  issuerRef:
    name: ""
    kind: Issuer

metrics:
  enabled: true
  image: ""
  imagePullPolicy: ""
  serviceMonitor: false
  # Resources for the exporter container. Empty → none set.
  resources: {}

# Free-form Valkey config directives appended to valkey.conf.
config: {}
  # maxmemory-policy: allkeys-lru
  # timeout: "0"

# Sentinel topology specifics (only used when topology=Sentinel).
sentinel:
  replicas: 3
  quorum: 0
  image: ""
  # Resources for the Sentinel container. Empty → none set.
  resources: {}
  # Timings in milliseconds. 0 → operator defaults (5000 / 60000). Applied to
  # running Sentinels without restarting them.
  downAfterMilliseconds: 0
  failoverTimeout: 0

# Pod scheduling.
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Pod / container security context. Empty → operator defaults (restricted PSA).
# Setting either one replaces the operator default for that level (no merge),
# so keep the restricted fields you still need. Example:
# containerSecurityContext:
#   allowPrivilegeEscalation: false
#   runAsNonRoot: true
#   capabilities:
#     drop: ["ALL"]
#   seccompProfile:
#     type: RuntimeDefault
#   readOnlyRootFilesystem: true
podSecurityContext: {}
containerSecurityContext: {}

podDisruptionBudget:
  # Enabled defaults to true when replicas>1.
  enabled: null
  maxUnavailable: 1

networkPolicy:
  enabled: false
  allowFrom: []
  # Peers allowed to reach the metrics exporter port. When set, the clients in
  # allowFrom no longer reach it. Empty: the exporter port is open to allowFrom.
  metricsFrom: []
  # Egress rules (opt-in): DNS and Valkey-to-Valkey traffic, plus extra rules.
  # Without extra rules, the backup upload, restoreFrom and replicateFrom are cut.
  egress:
    enabled: false
    dns: []      # empty: kube-dns pods in kube-system, UDP and TCP 53
    extra: []    # NetworkPolicyEgressRule list, appended as is
  # Example:
  # allowFrom:
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: my-consumer
  # metricsFrom:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  # egress:
  #   enabled: true
  #   extra:
  #     - to:
  #         - ipBlock:
  #             cidr: 203.0.113.10/32   # S3 endpoint
  #       ports:
  #         - port: 443

backup:
  enabled: false
  schedule: "0 3 * * *"
  retention: 7         # 0 = keep forever
  image: ""
  awsCLIImage: ""
  s3:
    bucket: ""
    endpoint: ""
    region: us-east-1
    prefix: ""
    credentialsSecret: ""
    encryption: ""        # "" (off) | AES256 | KMS
    kmsKeyId: ""          # optional, with encryption=KMS; empty uses the S3 default KMS key
