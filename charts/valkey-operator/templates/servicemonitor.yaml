{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled -}}
{{- $credentials := .Values.metrics.serviceMonitor.credentials | default dict -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "valkey-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey-operator.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "valkey-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      path: /metrics
      {{- if eq (include "valkey-operator.metricsSecure" .) "true" }}
      scheme: https
      authorization:
        type: Bearer
        credentials:
          name: {{ default (include "valkey-operator.metricsReaderName" .) $credentials.name | quote }}
          key: {{ if $credentials.name }}{{ default "token" $credentials.key | quote }}{{ else }}"token"{{ end }}
      {{- $tlsConfig := mergeOverwrite (dict "insecureSkipVerify" (not .Values.metrics.tlsSecretName)) (.Values.metrics.serviceMonitor.tlsConfig | default dict) }}
      tlsConfig:
        {{- toYaml $tlsConfig | nindent 8 }}
      {{- else }}
      scheme: http
      {{- end }}
{{- end }}
