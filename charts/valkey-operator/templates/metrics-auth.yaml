{{- if and .Values.metrics.enabled (eq (include "valkey-operator.metricsSecure" .) "true") }}
{{- $auth := printf "%s-%s-metrics-auth" .Release.Namespace (include "valkey-operator.fullname" .) }}
{{- $namespaceScoped := eq (include "valkey-operator.namespaceScoped" .) "true" }}
{{- $manageMetricsRBAC := and .Values.rbac.create (or (not $namespaceScoped) .Values.metrics.allowClusterRBAC) }}
{{- if $manageMetricsRBAC }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $auth }}
  labels:
    {{- include "valkey-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $auth }}
  labels:
    {{- include "valkey-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $auth }}
subjects:
  - kind: ServiceAccount
    name: {{ include "valkey-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- $credentials := .Values.metrics.serviceMonitor.credentials | default dict }}
{{- if and .Values.metrics.serviceMonitor.enabled (not $credentials.name) }}
{{- $reader := include "valkey-operator.metricsReaderName" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $reader }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey-operator.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $reader }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey-operator.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ $reader | quote }}
type: kubernetes.io/service-account-token
{{- if $manageMetricsRBAC }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $reader }}
  labels:
    {{- include "valkey-operator.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $reader }}
  labels:
    {{- include "valkey-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $reader }}
subjects:
  - kind: ServiceAccount
    name: {{ $reader }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
